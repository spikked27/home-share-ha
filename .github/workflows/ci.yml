name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - name: Test against Home Assistant 2026.10.2
        run: docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint python ghcr.io/home-assistant/home-assistant:2026.10.2 -m unittest discover -s integration_tests -v
      - name: Test against Home Assistant 2026.11.0
        run: docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint python ghcr.io/home-assistant/home-assistant:2026.11.0 -m unittest discover -s integration_tests -v
      - run: node --check custom_components/home_share/frontend/home-share.js
      - run: python scripts/package.py
