name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - name: Test against the complete Home Assistant runtime
        run: docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint python ghcr.io/home-assistant/home-assistant:2026.10.2 -m unittest discover -s integration_tests -v
      - run: node --check custom_components/home_share/frontend/home-share.js
      - run: python scripts/package.py
